name: Release API image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cupcakeshop-api

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cupcake
          POSTGRES_PASSWORD: cupcake
          POSTGRES_DB: cupcake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cupcake -d cupcake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cupcake:cupcake@localhost:5432/cupcake_test
      TEST_DATABASE_URL: postgresql://cupcake:cupcake@localhost:5432/cupcake_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      CORS_ORIGIN: http://localhost:3001
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  image:
    name: Build e push da imagem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag imutável deste commit, usada no deploy do Render
      - id: ref
        run: echo "value=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  migrate:
    name: Migrations no Neon
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Use a URL DIRETA do Neon (sem "-pooler" no host) para as migrations
      DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - if: env.DATABASE_URL == ''
        working-directory: .
        run: echo "::warning::Secret NEON_DIRECT_URL não configurado; migrations não foram aplicadas."

      - if: env.DATABASE_URL != ''
        uses: actions/checkout@v4

      - if: env.DATABASE_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - if: env.DATABASE_URL != ''
        run: npm ci --ignore-scripts

      - if: env.DATABASE_URL != ''
        run: npx prisma migrate deploy

  deploy:
    name: Deploy no Render
    needs: [image, migrate]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - if: env.HOOK == ''
        run: echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado; deploy não foi disparado."

      - if: env.HOOK != ''
        run: |
          encoded=$(jq -rn --arg v "$IMAGE_REF" '$v|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${encoded}" > /dev/null
          echo "Deploy disparado com ${IMAGE_REF}"
