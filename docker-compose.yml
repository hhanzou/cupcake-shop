services:
  api:
    build:
      context: ./backend
      target: development
    container_name: cupcake-api
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://cupcake:cupcake@db:5432/cupcake_db
      NODE_ENV: development
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
      CORS_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: admin@cupcakeshop.local
      ADMIN_PASSWORD: admin12345
      TEST_DATABASE_URL: postgresql://cupcake:cupcake@db:5432/cupcake_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: cupcake-db
    environment:
      POSTGRES_USER: cupcake
      POSTGRES_PASSWORD: cupcake
      POSTGRES_DB: cupcake_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cupcake -d cupcake_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
